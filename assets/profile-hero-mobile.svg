<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" fill="none" role="img" aria-labelledby="title"><title id="title">İbrahim Ethem Kurt — Bandırma, TR. Simple products, shaped by real user needs.</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.label{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}</style>
<defs>
    <linearGradient id="background" x1="48" y1="22" x2="1150" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1830"/>
      <stop offset="0.56" stop-color="#081321"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="signal" x1="88" y1="0" x2="1112" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3985FF"/>
      <stop offset="0.5" stop-color="#42D3FF"/>
      <stop offset="1" stop-color="#E5B84B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42D3FF" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#42D3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A7EBFF" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#42D3FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#42D3FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientTransform="translate(976 74) rotate(135) scale(480 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A7BFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#1A7BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#B9D9FF" stroke-opacity="0.055"/>
      <circle cx="1" cy="1" r="1" fill="#8BBFFF" fill-opacity="0.12"/>
    </pattern>
    <filter id="soft-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="428" rx="27"/>
    </clipPath>
  </defs><style>
    .display { font-family: "Segoe UI", Arial, sans-serif; }
    .utility { font-family: Consolas, "Courier New", monospace; }
    .flow-line { animation: flow 5s linear infinite; }
    .scan { animation: scan 8s ease-in-out infinite; }
    .status { animation: status 2.4s ease-in-out infinite; }
    .node-1 { animation: pulse 5s ease-in-out infinite; animation-delay: 0s; }
    .node-2 { animation: pulse 5s ease-in-out infinite; animation-delay: 1s; }
    .node-3 { animation: pulse 5s ease-in-out infinite; animation-delay: 2s; }
    .node-4 { animation: pulse 5s ease-in-out infinite; animation-delay: 3s; }
    .node-5 { animation: pulse 5s ease-in-out infinite; animation-delay: 4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes flow {
      to { stroke-dashoffset: -110; }
    }
    @keyframes scan {
      0%, 12% { transform: translateX(-600px); opacity: 0; }
      24%, 72% { opacity: 1; }
      88%, 100% { transform: translateX(1450px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 15%, 100% { opacity: 0.38; }
      7% { opacity: 1; }
    }
    @keyframes status {
      0%, 100% { opacity: 0.38; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-line, .scan, .status, .node-1, .node-2, .node-3, .node-4, .node-5, .cursor { animation: none; opacity: 1; }
    }
  </style><rect x="1" y="1" width="518" height="378" rx="22" fill="url(#background)" stroke="#2D4868"/><rect x="12" y="12" width="496" height="354" rx="12" fill="url(#grid)"/><text x="28" y="37" font-size="11" fill="#AFC1D8" class="utility" letter-spacing="1">PRODUCT / PEOPLE / DELIVERY</text><text x="492" y="37" font-size="11" fill="#AFC1D8" class="utility" text-anchor="end" letter-spacing="1">BANDIRMA / TR</text><text x="28" y="103" font-size="40" fill="#F2F7FF" font-weight="700" letter-spacing="-1">İbrahim Ethem Kurt</text><text x="28" y="151" font-size="29" fill="#AFC1D8" >Simple products, shaped</text>
<text x="28" y="188" font-size="29" fill="#AFC1D8" >by real user needs.</text><rect x="28" y="219" width="174" height="37" rx="18" fill="#8DB9FF" fill-opacity=".07" stroke="#8DB9FF" stroke-opacity=".35"/><text x="115" y="242" font-size="12" fill="#8DB9FF" class="utility" text-anchor="middle">PRODUCT OWNERSHIP</text><rect x="212" y="219" width="83" height="37" rx="18" fill="#86E7FF" fill-opacity=".07" stroke="#86E7FF" stroke-opacity=".35"/><text x="253.5" y="242" font-size="12" fill="#86E7FF" class="utility" text-anchor="middle">SCRUM</text><rect x="305" y="219" width="187" height="37" rx="18" fill="#F1CD73" fill-opacity=".07" stroke="#F1CD73" stroke-opacity=".35"/><text x="398.5" y="242" font-size="12" fill="#F1CD73" class="utility" text-anchor="middle">PROJECT MANAGEMENT</text><path class="flow-line" d="M44 305H476" stroke="url(#signal)" stroke-width="2" stroke-dasharray="10 14"/><g class="node-1"><circle cx="44" cy="305" r="9" fill="#0B1830" stroke="#3985FF"/><circle cx="44" cy="305" r="3" fill="#3985FF"/></g><text x="44" y="342" font-size="12" fill="#AFC1D8" class="utility" text-anchor="middle">DISCOVER</text><g class="node-2"><circle cx="152" cy="305" r="9" fill="#0B1830" stroke="#3CA9FF"/><circle cx="152" cy="305" r="3" fill="#3CA9FF"/></g><text x="152" y="342" font-size="12" fill="#AFC1D8" class="utility" text-anchor="middle">PRIORITIZE</text><g class="node-3"><circle cx="260" cy="305" r="9" fill="#0B1830" stroke="#42D3FF"/><circle cx="260" cy="305" r="3" fill="#42D3FF"/></g><text x="260" y="342" font-size="12" fill="#AFC1D8" class="utility" text-anchor="middle">ALIGN</text><g class="node-4"><circle cx="368" cy="305" r="9" fill="#0B1830" stroke="#7FD1C7"/><circle cx="368" cy="305" r="3" fill="#7FD1C7"/></g><text x="368" y="342" font-size="12" fill="#AFC1D8" class="utility" text-anchor="middle">DELIVER</text><g class="node-5"><circle cx="476" cy="305" r="9" fill="#0B1830" stroke="#E5B84B"/><circle cx="476" cy="305" r="3" fill="#E5B84B"/></g><text x="476" y="342" font-size="12" fill="#AFC1D8" class="utility" text-anchor="middle">LEARN</text>
</svg>
