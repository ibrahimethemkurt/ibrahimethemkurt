<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" fill="none" role="img" aria-labelledby="title"><title id="title">Product focus and the four Agile Manifesto values</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.label{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}</style>
<rect width="1000" height="520" fill="#FFFFFF"/><text x="32" y="29" font-size="14" fill="#2563EB" class="label">MY FOCUS</text><text x="32" y="71" font-size="34" fill="#333333" font-weight="500" letter-spacing="-.55">Simple products.</text>
<text x="32" y="111" font-size="34" fill="#333333" font-weight="500" letter-spacing="-.55">Real user needs.</text><text x="32" y="148" font-size="18" fill="#59636E" >Management Information Systems</text><text x="460" y="54" font-size="21" fill="#333333" >I am developing my skills in Product</text>
<text x="460" y="85" font-size="21" fill="#333333" >Ownership, Scrum and Project Management.</text><text x="460" y="128" font-size="21" fill="#59636E" >My goal is to make products easier to use.</text><path d="M32 180h936" stroke="#D1D9E0"/><text x="32" y="221" font-size="24" fill="#333333" font-weight="500">Agile Manifesto</text><text x="968" y="220" font-size="14" fill="#59636E" class="label" text-anchor="end">2001</text><text x="32" y="269" font-size="22" fill="#333333" font-weight="400">Individuals and interactions</text><text x="484" y="269" font-size="18" fill="#59636E" font-style="italic">over</text><text x="552" y="269" font-size="21" fill="#59636E" >processes and tools</text><path d="M32 289h936" stroke="#D1D9E0"/><text x="32" y="318" font-size="22" fill="#333333" font-weight="400">Working software</text><text x="484" y="318" font-size="18" fill="#59636E" font-style="italic">over</text><text x="552" y="318" font-size="21" fill="#59636E" >comprehensive documentation</text><path d="M32 338h936" stroke="#D1D9E0"/><text x="32" y="367" font-size="22" fill="#333333" font-weight="400">Customer collaboration</text><text x="484" y="367" font-size="18" fill="#59636E" font-style="italic">over</text><text x="552" y="367" font-size="21" fill="#59636E" >contract negotiation</text><path d="M32 387h936" stroke="#D1D9E0"/><text x="32" y="416" font-size="22" fill="#333333" font-weight="400">Responding to change</text><text x="484" y="416" font-size="18" fill="#59636E" font-style="italic">over</text><text x="552" y="416" font-size="21" fill="#59636E" >following a plan</text><text x="32" y="482" font-size="18" fill="#59636E" >Both sides have value; the items on the left receive greater emphasis.</text>
</svg>
