<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1028" viewBox="0 0 520 1028" fill="none" role="img" aria-labelledby="title"><title id="title">Product focus and the four Agile Manifesto values</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.label{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}</style>
<rect width="520" height="1028" fill="#FFFFFF"/><text x="20" y="32" font-size="19" fill="#2563EB" class="label">MY FOCUS</text><text x="20" y="82" font-size="40" fill="#333333" font-weight="500" letter-spacing="-.55">Simple products.</text>
<text x="20" y="129" font-size="40" fill="#333333" font-weight="500" letter-spacing="-.55">Real user needs.</text><text x="20" y="166" font-size="25" fill="#59636E" >Management Information Systems</text><text x="20" y="225" font-size="30" fill="#333333" >I am developing my skills in</text>
<text x="20" y="267" font-size="30" fill="#333333" >Product Ownership, Scrum</text>
<text x="20" y="309" font-size="30" fill="#333333" >and Project Management.</text><text x="20" y="385" font-size="30" fill="#59636E" >My goal is to make products</text>
<text x="20" y="427" font-size="30" fill="#59636E" >easier to use.</text><path d="M20 464h480" stroke="#D1D9E0"/><text x="20" y="511" font-size="30" fill="#333333" font-weight="500">Agile Manifesto</text><text x="500" y="510" font-size="20" fill="#59636E" class="label" text-anchor="end">2001</text><text x="20" y="565" font-size="30" fill="#333333" font-weight="400">Individuals and interactions</text><text x="20" y="602" font-size="29" fill="#59636E" >over processes and tools</text><path d="M20 626h480" stroke="#D1D9E0"/><text x="20" y="665" font-size="30" fill="#333333" font-weight="400">Working software</text><text x="20" y="702" font-size="29" fill="#59636E" >over comprehensive documentation</text><path d="M20 726h480" stroke="#D1D9E0"/><text x="20" y="765" font-size="30" fill="#333333" font-weight="400">Customer collaboration</text><text x="20" y="802" font-size="29" fill="#59636E" >over contract negotiation</text><path d="M20 826h480" stroke="#D1D9E0"/><text x="20" y="865" font-size="30" fill="#333333" font-weight="400">Responding to change</text><text x="20" y="902" font-size="29" fill="#59636E" >over following a plan</text><text x="20" y="962" font-size="29" fill="#59636E" >Both sides have value; the items</text>
<text x="20" y="999" font-size="29" fill="#59636E" >on the left receive greater emphasis.</text>
</svg>
