<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="526" viewBox="0 0 1040 526" role="img" aria-labelledby="title desc">
<title id="title">The Product Desk</title><desc id="desc">Three questions guide my product learning: Which problem matters? What comes first? Did it create value?</desc>
<defs><linearGradient id="accent"><stop stop-color="#88B8FF"/><stop offset=".5" stop-color="#77E0EC"/><stop offset="1" stop-color="#F0CC7C"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; }
.mono { font-family: Consolas, 'Courier New', monospace; }
.traveller { animation: travel 8s linear infinite; }
.spark { animation: breathe 4s ease-in-out infinite; }
@keyframes travel { to { stroke-dashoffset: -160; } }
@keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .traveller,.spark { animation:none; } }
</style>
<rect x="1" y="1" width="1038" height="524" rx="24" fill="#0B1422" stroke="#293E55"/>
<text x="34" y="43" font-size="14" fill="#77E0EC" class="mono" letter-spacing="2">THE PRODUCT DESK</text><text x="34" y="94" font-size="38" fill="#EFF5FF" font-weight="650">Good work starts</text><text x="350" y="94" font-size="38" fill="#EFF5FF" font-weight="650">with better questions.</text><rect x="28" y="126" width="320" height="302" rx="18" fill="#101F31" stroke="#293E55"/><path d="M50 127h276" stroke="#88B8FF" stroke-opacity=".75" stroke-width="2"/><text x="50" y="159" font-size="14" fill="#88B8FF" class="mono" letter-spacing="2">UNDERSTAND</text><g transform="translate(287 142)" fill="none" stroke="#88B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="17" r="10"/><path d="M24 24l11 11M13 17h8M17 13v8"/></g><text x="50" y="209" font-size="29" fill="#EFF5FF" >Which problem</text><text x="50" y="243" font-size="29" fill="#EFF5FF" >matters?</text><text x="50" y="288" font-size="21" fill="#ADBED3" >Listen to users.</text><text x="50" y="317" font-size="21" fill="#ADBED3" >Surface assumptions.</text><text x="50" y="346" font-size="21" fill="#ADBED3" >Frame the need.</text><path d="M50 374h276" stroke="#293E55"/><circle class="spark" cx="54" cy="402" r="3" fill="#88B8FF"/><text x="67" y="407" font-size="13" fill="#88B8FF" class="mono" letter-spacing="1.2">PROBLEM BRIEF</text><rect x="360" y="126" width="320" height="302" rx="18" fill="#101F31" stroke="#293E55"/><path d="M382 127h276" stroke="#77E0EC" stroke-opacity=".75" stroke-width="2"/><text x="382" y="159" font-size="14" fill="#77E0EC" class="mono" letter-spacing="2">DECIDE</text><g transform="translate(619 142)" fill="none" stroke="#77E0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h8M6 21h8M6 32h8M21 10h15M21 21h11M21 32h7"/></g><text x="382" y="209" font-size="29" fill="#EFF5FF" >What comes</text><text x="382" y="243" font-size="29" fill="#EFF5FF" >first?</text><text x="382" y="288" font-size="21" fill="#ADBED3" >Weigh impact.</text><text x="382" y="317" font-size="21" fill="#ADBED3" >Make trade-offs.</text><text x="382" y="346" font-size="21" fill="#ADBED3" >Align on a shared goal.</text><path d="M382 374h276" stroke="#293E55"/><circle class="spark" cx="386" cy="402" r="3" fill="#77E0EC"/><text x="399" y="407" font-size="13" fill="#77E0EC" class="mono" letter-spacing="1.2">ORDERED BACKLOG</text><rect x="692" y="126" width="320" height="302" rx="18" fill="#101F31" stroke="#293E55"/><path d="M714 127h276" stroke="#F0CC7C" stroke-opacity=".75" stroke-width="2"/><text x="714" y="159" font-size="14" fill="#F0CC7C" class="mono" letter-spacing="2">LEARN</text><g transform="translate(951 142)" fill="none" stroke="#F0CC7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M33 15A14 14 0 1 0 33 29M33 5v10H23M9 22l8 6 10-13"/></g><text x="714" y="209" font-size="29" fill="#EFF5FF" >Did it create</text><text x="714" y="243" font-size="29" fill="#EFF5FF" >value?</text><text x="714" y="288" font-size="21" fill="#ADBED3" >Deliver in small steps.</text><text x="714" y="317" font-size="21" fill="#ADBED3" >Seek feedback.</text><text x="714" y="346" font-size="21" fill="#ADBED3" >Revisit the plan.</text><path d="M714 374h276" stroke="#293E55"/><circle class="spark" cx="718" cy="402" r="3" fill="#F0CC7C"/><text x="731" y="407" font-size="13" fill="#F0CC7C" class="mono" letter-spacing="1.2">FEEDBACK LOOP</text><text x="34" y="467" font-size="14" fill="#F0CC7C" class="mono" letter-spacing="2">ON MY RADAR</text><text x="212" y="468" font-size="21" fill="#ADBED3" >Product discovery / Scrum / Project planning</text><path class="traveller" d="M34 506H1006" stroke="url(#accent)" stroke-opacity=".5" stroke-dasharray="28 52"/>
</svg>
