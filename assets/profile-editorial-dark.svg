<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" fill="none" role="img" aria-labelledby="title"><title id="title">Product focus and the four Agile Manifesto values</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.label{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}</style>
<rect width="1000" height="594" fill="#0D1117"/><text x="32" y="32" font-size="16" fill="#88B8FF" class="label">MY FOCUS</text><text x="32" y="80" font-size="40" fill="#E5E5E5" font-weight="600" letter-spacing="-.8">Simple products.</text>
<text x="32" y="127" font-size="40" fill="#E5E5E5" font-weight="600" letter-spacing="-.8">Real user needs.</text><text x="32" y="165" font-size="20" fill="#A3A3A3" >Management Information Systems</text><text x="460" y="64" font-size="24" fill="#E5E5E5" >I am developing my skills in Product</text>
<text x="460" y="99" font-size="24" fill="#E5E5E5" >Ownership, Scrum and Project Management.</text><text x="460" y="145" font-size="24" fill="#A3A3A3" >My goal is to make products easier to use.</text><path d="M32 206h936" stroke="#30363D"/><text x="32" y="255" font-size="28" fill="#E5E5E5" font-weight="600">Agile Manifesto</text><text x="968" y="254" font-size="17" fill="#A3A3A3" class="label" text-anchor="end">2001</text><text x="32" y="309" font-size="26" fill="#E5E5E5" font-weight="500">Individuals and interactions</text><text x="484" y="309" font-size="21" fill="#A3A3A3" font-style="italic">over</text><text x="552" y="309" font-size="24" fill="#A3A3A3" >processes and tools</text><path d="M32 332h936" stroke="#30363D"/><text x="32" y="366" font-size="26" fill="#E5E5E5" font-weight="500">Working software</text><text x="484" y="366" font-size="21" fill="#A3A3A3" font-style="italic">over</text><text x="552" y="366" font-size="24" fill="#A3A3A3" >comprehensive documentation</text><path d="M32 389h936" stroke="#30363D"/><text x="32" y="423" font-size="26" fill="#E5E5E5" font-weight="500">Customer collaboration</text><text x="484" y="423" font-size="21" fill="#A3A3A3" font-style="italic">over</text><text x="552" y="423" font-size="24" fill="#A3A3A3" >contract negotiation</text><path d="M32 446h936" stroke="#30363D"/><text x="32" y="480" font-size="26" fill="#E5E5E5" font-weight="500">Responding to change</text><text x="484" y="480" font-size="21" fill="#A3A3A3" font-style="italic">over</text><text x="552" y="480" font-size="24" fill="#A3A3A3" >following a plan</text><text x="32" y="547" font-size="22" fill="#A3A3A3" >Both sides have value; the items on the left receive greater emphasis.</text>
</svg>
