<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1064" viewBox="0 0 520 1064" fill="none" role="img" aria-labelledby="title"><title id="title">Product focus and the four Agile Manifesto values</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.label{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}</style>
<rect width="520" height="1064" fill="#0D1117"/><text x="20" y="34" font-size="20" fill="#88B8FF" class="label">MY FOCUS</text><text x="20" y="87" font-size="43" fill="#E5E5E5" font-weight="600" letter-spacing="-.8">Simple products.</text>
<text x="20" y="137" font-size="43" fill="#E5E5E5" font-weight="600" letter-spacing="-.8">Real user needs.</text><text x="20" y="179" font-size="26" fill="#A3A3A3" >Management Information Systems</text><text x="20" y="239" font-size="29" fill="#E5E5E5" >I am developing my skills in</text>
<text x="20" y="281" font-size="29" fill="#E5E5E5" >Product Ownership, Scrum</text>
<text x="20" y="323" font-size="29" fill="#E5E5E5" >and Project Management.</text><text x="20" y="399" font-size="29" fill="#A3A3A3" >My goal is to make products</text>
<text x="20" y="441" font-size="29" fill="#A3A3A3" >easier to use.</text><path d="M20 480h480" stroke="#30363D"/><text x="20" y="529" font-size="31" fill="#E5E5E5" font-weight="600">Agile Manifesto</text><text x="500" y="528" font-size="21" fill="#A3A3A3" class="label" text-anchor="end">2001</text><text x="20" y="583" font-size="29" fill="#E5E5E5" font-weight="500">Individuals and interactions</text><text x="20" y="621" font-size="28" fill="#A3A3A3" >over processes and tools</text><path d="M20 646h480" stroke="#30363D"/><text x="20" y="688" font-size="29" fill="#E5E5E5" font-weight="500">Working software</text><text x="20" y="726" font-size="28" fill="#A3A3A3" >over comprehensive documentation</text><path d="M20 751h480" stroke="#30363D"/><text x="20" y="793" font-size="29" fill="#E5E5E5" font-weight="500">Customer collaboration</text><text x="20" y="831" font-size="28" fill="#A3A3A3" >over contract negotiation</text><path d="M20 856h480" stroke="#30363D"/><text x="20" y="898" font-size="29" fill="#E5E5E5" font-weight="500">Responding to change</text><text x="20" y="936" font-size="28" fill="#A3A3A3" >over following a plan</text><text x="20" y="991" font-size="28" fill="#A3A3A3" >Both sides have value; the items</text>
<text x="20" y="1029" font-size="28" fill="#A3A3A3" >on the left receive greater emphasis.</text>
</svg>
