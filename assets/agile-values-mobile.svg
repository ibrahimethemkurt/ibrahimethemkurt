<svg xmlns="http://www.w3.org/2000/svg" width="560" height="844" viewBox="0 0 560 844" role="img" aria-labelledby="title desc">
<title id="title">Agile Manifesto — the four values</title><desc id="desc">Four values from the Manifesto for Agile Software Development. Both sides have value; the left-hand items receive greater emphasis. Source: agilemanifesto.org.</desc>
<defs><linearGradient id="accent"><stop stop-color="#88B8FF"/><stop offset=".5" stop-color="#77E0EC"/><stop offset="1" stop-color="#F0CC7C"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; }
.mono { font-family: Consolas, 'Courier New', monospace; }
.traveller { animation: travel 8s linear infinite; }
.spark { animation: breathe 4s ease-in-out infinite; }
@keyframes travel { to { stroke-dashoffset: -160; } }
@keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .traveller,.spark { animation:none; } }
</style>
<rect x="1" y="1" width="558" height="842" rx="24" fill="#0B1422" stroke="#293E55"/>
<text x="34" y="43" font-size="14" fill="#F0CC7C" class="mono" letter-spacing="2">VALUES THAT GUIDE THE WORK</text><text x="34" y="99" font-size="40" fill="#EFF5FF" font-weight="650" letter-spacing="-1">Agile Manifesto</text><text x="34" y="135" font-size="23" fill="#ADBED3" >Four values. A shared direction.</text><rect x="28" y="164" width="504" height="126" rx="14" fill="#111F30" stroke="#24364A"/><path d="M29 182v90" stroke="#88B8FF" stroke-width="3"/><text x="48" y="191" font-size="14" fill="#88B8FF" class="mono" letter-spacing="2">PEOPLE</text><text x="48" y="230" font-size="28" fill="#EFF5FF" font-weight="600">Individuals and interactions</text><text x="48" y="263" font-size="22" fill="#ADBED3" >over processes and tools</text><rect x="28" y="304" width="504" height="126" rx="14" fill="#101D2D" stroke="#24364A"/><path d="M29 322v90" stroke="#77E0EC" stroke-width="3"/><text x="48" y="331" font-size="14" fill="#77E0EC" class="mono" letter-spacing="2">VALUE</text><text x="48" y="370" font-size="28" fill="#EFF5FF" font-weight="600">Working software</text><text x="48" y="403" font-size="22" fill="#ADBED3" >over comprehensive documentation</text><rect x="28" y="444" width="504" height="126" rx="14" fill="#111F30" stroke="#24364A"/><path d="M29 462v90" stroke="#88B8FF" stroke-width="3"/><text x="48" y="471" font-size="14" fill="#88B8FF" class="mono" letter-spacing="2">PARTNERSHIP</text><text x="48" y="510" font-size="28" fill="#EFF5FF" font-weight="600">Customer collaboration</text><text x="48" y="543" font-size="22" fill="#ADBED3" >over contract negotiation</text><rect x="28" y="584" width="504" height="126" rx="14" fill="#101D2D" stroke="#24364A"/><path d="M29 602v90" stroke="#F0CC7C" stroke-width="3"/><text x="48" y="611" font-size="14" fill="#F0CC7C" class="mono" letter-spacing="2">ADAPTABILITY</text><text x="48" y="650" font-size="28" fill="#EFF5FF" font-weight="600">Responding to change</text><text x="48" y="683" font-size="22" fill="#ADBED3" >over following a plan</text><text x="34" y="752" font-size="21" fill="#ADBED3" >Both sides have value.</text><text x="34" y="782" font-size="21" fill="#ADBED3" >The left-hand items receive greater emphasis.</text><text x="34" y="818" font-size="14" fill="#F0CC7C" class="mono" letter-spacing="2">AGILEMANIFESTO.ORG  /  2001</text><path d="M501 811h18v18m-18 0 18-18" stroke="#F0CC7C" stroke-width="2" fill="none"/>
</svg>
